<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slice of Life AI</title>
    <link rel="icon" type="image/png" href="./assets/sliceoflife-icon.png" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-ink: #f2f4f5;
        --color-fog: #171a1e;
        --color-paper: #101214;
        --color-line: #2c3137;
        --color-moss: #6f9d78;
        --color-lake: #6c9db2;
        --color-clay: #cf765e;
        --color-amber: #d6a04d;
      }
      body {
        position: relative;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 88% -12%, rgba(180, 35, 50, 0.22), transparent 30%),
          radial-gradient(circle at 5% 12%, rgba(49, 95, 114, 0.2), transparent 28%),
          linear-gradient(135deg, #090a0c 0%, #111417 52%, #181c20 100%);
        background-attachment: fixed;
      }
      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        pointer-events: none;
        background:
          linear-gradient(115deg, rgba(255, 255, 255, 0.06), transparent 34%),
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: auto, 72px 72px, 72px 72px;
        mask-image: linear-gradient(to bottom, black, transparent 88%);
      }
      body::after {
        position: fixed;
        top: -18rem;
        right: -12rem;
        width: 42rem;
        height: 42rem;
        z-index: -1;
        content: "";
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        box-shadow:
          0 0 0 1.5rem rgba(255, 255, 255, 0.025),
          0 0 5rem rgba(180, 35, 50, 0.14);
        opacity: 0.7;
      }
      .text-ink {
        color: #f2f4f5 !important;
      }
      .bg-ink.text-white {
        color: #090a0c !important;
      }
      [class*="bg-white"] {
        background-color: rgba(255, 255, 255, 0.045) !important;
      }
      [class*="text-stone-500"] {
        color: #8f989f !important;
      }
      [class*="text-stone-600"] {
        color: #aeb6bc !important;
      }
      [class*="text-stone-700"] {
        color: #c8cdd1 !important;
      }
      input,
      textarea {
        color: #f2f4f5;
        caret-color: #cf4050;
      }
      input::placeholder,
      textarea::placeholder {
        color: #737c83;
      }
      @media (max-width: 639px) {
        .app-sidebar {
          padding: 0.75rem;
          border-bottom: 1px solid #2c3137;
        }
        .app-sidebar > div:first-child {
          margin-bottom: 0.75rem;
          padding: 0.65rem;
        }
        .app-sidebar > div:first-child img {
          height: 2.25rem;
          width: 2.25rem;
        }
        .app-sidebar > div:first-child h1 {
          font-size: 0.95rem;
        }
        .app-sidebar > div:first-child p {
          font-size: 0.65rem;
        }
        .app-nav {
          display: flex;
          gap: 0.45rem;
          overflow-x: auto;
          padding-bottom: 0.2rem;
          scrollbar-width: none;
        }
        .app-nav::-webkit-scrollbar {
          display: none;
        }
        .app-nav button {
          min-width: max-content;
          height: 2.25rem;
          padding: 0 0.65rem;
          font-size: 0.72rem;
        }
        .app-nav button span {
          height: 1.45rem;
          width: 1.45rem;
          font-size: 0.62rem;
        }
        .app-gemini {
          display: none;
        }
        .app-data-actions {
          display: flex;
          gap: 0.45rem;
          margin-top: 0.7rem;
        }
        .app-data-actions button,
        .app-data-actions label {
          flex: 1;
          height: 2.15rem;
          font-size: 0.68rem;
        }
        main {
          padding: 1rem !important;
        }
        .app-metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .app-metrics article {
          padding: 0.8rem;
        }
        .app-metrics article > div {
          margin-top: 0.55rem;
          font-size: 1.65rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      fetch("./app.jsx")
        .then((response) => response.text())
        .then((source) => {
          const compiled = Babel.transform(source, {
            presets: [[Babel.availablePresets.react, { runtime: "classic" }]],
          }).code;
          (0, eval)(compiled);
        })
        .catch((error) => console.error("Unable to load the React app.", error));
    </script>
  </body>
</html>
