<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slice of Life AI</title>
    <link rel="icon" type="image/png" href="./assets/sliceoflife-icon.png" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-ink: #f2f4f5;
        --color-fog: #171a1e;
        --color-paper: #101214;
        --color-line: #2c3137;
        --color-moss: #6f9d78;
        --color-lake: #6c9db2;
        --color-clay: #cf765e;
        --color-amber: #d6a04d;
      }
      body {
        position: relative;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 88% -12%, rgba(180, 35, 50, 0.22), transparent 30%),
          radial-gradient(circle at 5% 12%, rgba(49, 95, 114, 0.2), transparent 28%),
          linear-gradient(135deg, #090a0c 0%, #111417 52%, #181c20 100%);
        background-attachment: fixed;
      }
      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        pointer-events: none;
        background:
          linear-gradient(115deg, rgba(255, 255, 255, 0.06), transparent 34%),
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: auto, 72px 72px, 72px 72px;
        mask-image: linear-gradient(to bottom, black, transparent 88%);
      }
      body::after {
        position: fixed;
        top: -18rem;
        right: -12rem;
        width: 42rem;
        height: 42rem;
        z-index: -1;
        content: "";
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        box-shadow:
          0 0 0 1.5rem rgba(255, 255, 255, 0.025),
          0 0 5rem rgba(180, 35, 50, 0.14);
        opacity: 0.7;
      }
      .text-ink {
        color: #f2f4f5 !important;
      }
      .bg-ink.text-white {
        color: #090a0c !important;
      }
      [class*="bg-white"] {
        background-color: rgba(255, 255, 255, 0.045) !important;
      }
      [class*="text-stone-500"] {
        color: #8f989f !important;
      }
      [class*="text-stone-600"] {
        color: #aeb6bc !important;
      }
      [class*="text-stone-700"] {
        color: #c8cdd1 !important;
      }
      input,
      textarea {
        color: #f2f4f5;
        caret-color: #cf4050;
      }
      input::placeholder,
      textarea::placeholder {
        color: #737c83;
      }
      @media (max-width: 639px) {
        .app-sidebar {
          position: fixed;
          right: 0;
          bottom: 0;
          left: 0;
          z-index: 30;
          height: 5.35rem;
          padding: 0.5rem 0.55rem calc(0.5rem + env(safe-area-inset-bottom));
          border-top: 1px solid #3c444c;
          border-bottom: 0;
          background: rgba(12, 14, 16, 0.9);
          box-shadow: 0 -1rem 2.5rem rgba(0, 0, 0, 0.2);
          backdrop-filter: blur(22px);
        }
        .app-sidebar > div:first-child {
          display: none;
        }
        .app-nav {
          display: flex;
          height: 100%;
          gap: 0.2rem;
          overflow: visible;
          padding: 0;
        }
        .app-nav button {
          min-width: 0;
          flex: 1;
          height: 100%;
          flex-direction: column;
          justify-content: center;
          gap: 0.25rem;
          padding: 0.25rem 0.1rem;
          border-radius: 0.7rem;
          color: #9ca5ad;
          font-size: 0.64rem;
          letter-spacing: 0.01em;
        }
        .app-nav button span {
          height: 1.85rem;
          width: 1.85rem;
          font-size: 0.62rem;
          background: #242a30;
          color: #d7dde1;
          box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }
        .app-nav button.bg-ink {
          background: rgba(201, 52, 70, 0.17);
          color: #ffffff;
        }
        .app-nav button.bg-ink span {
          background: #c93446;
          color: #ffffff;
          box-shadow: 0 0 1rem rgba(201, 52, 70, 0.42);
        }
        .app-gemini,
        .app-cloudflare {
          display: none;
        }
        .app-data-actions {
          display: none;
        }
        main {
          min-height: 100vh;
          padding: 0.85rem 0.85rem 6.45rem !important;
        }
        main > header {
          position: sticky;
          top: 0;
          z-index: 20;
          margin: -0.85rem -0.85rem 1rem;
          padding: 0.85rem;
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
          background: rgba(9, 11, 13, 0.82);
          backdrop-filter: blur(18px);
        }
        .mobile-brand {
          display: flex;
        }
        main > header h2 {
          font-size: 2.35rem;
          line-height: 0.95;
        }
        main > header > div:last-child {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          width: 100%;
          align-items: center;
        }
        .app-metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .app-metrics article {
          padding: 0.8rem;
        }
        .app-metrics article > div {
          margin-top: 0.55rem;
          font-size: 1.65rem;
        }
        .dashboard-view > section:nth-child(2),
        .dashboard-view > section:nth-child(3) {
          grid-template-columns: minmax(0, 1fr);
        }
        .dashboard-view > section:nth-child(2) > section:first-child .h-48 {
          width: 8.5rem;
          height: 8.5rem;
        }
        .dashboard-view > section:nth-child(2) > section:first-child .h-32 {
          width: 5.75rem;
          height: 5.75rem;
        }
        .dashboard-view > section:nth-child(2) > section:first-child svg {
          height: 7rem;
        }
        .dashboard-view > section:nth-child(3) .space-y-3 {
          display: grid;
          gap: 0.65rem;
        }
        .dashboard-view > section:nth-child(3) .md\:grid-cols-3 {
          display: grid;
          grid-template-columns: 1fr;
          gap: 0.55rem;
        }
        .habit-board {
          grid-template-columns: minmax(0, 1fr);
          max-height: 58vh;
          overflow-y: auto;
          gap: 0.55rem;
          padding-right: 0.2rem;
        }
        .habit-board article {
          padding: 0.7rem;
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(8.5rem, 0.75fr);
          align-items: center;
          gap: 0.75rem;
        }
        .habit-board article h3 {
          font-size: 0.78rem;
        }
        .habit-board article > div:first-child {
          margin-bottom: 0;
        }
        .habit-board article button {
          height: 2rem;
          font-size: 0.62rem;
        }
        .habit-rate-grid,
        .rewards-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .review-table-wrap {
          max-height: 62vh;
          overscroll-behavior: contain;
        }
        .review-table-wrap table {
          min-width: 700px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      fetch("./app.jsx")
        .then((response) => response.text())
        .then((source) => {
          const compiled = Babel.transform(source, {
            presets: [[Babel.availablePresets.react, { runtime: "classic" }]],
          }).code;
          (0, eval)(compiled);
        })
        .catch((error) => console.error("Unable to load the React app.", error));
    </script>
  </body>
</html>
