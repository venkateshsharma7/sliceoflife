<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slice of Life AI</title>
    <link rel="icon" type="image/png" href="./assets/sliceoflife-icon.png" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-ink: #151917;
        --color-fog: #f4f5f1;
        --color-paper: #fffefa;
        --color-line: #e4e0d6;
        --color-moss: #46624a;
        --color-lake: #315f72;
        --color-clay: #a45d45;
        --color-amber: #b67b2a;
      }
      body {
        position: relative;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 92% -8%, rgba(180, 35, 50, 0.16), transparent 28%),
          radial-gradient(circle at 8% 18%, rgba(49, 95, 114, 0.13), transparent 26%),
          linear-gradient(135deg, #f8f8f5 0%, #e9ebea 48%, #dfe3e2 100%);
        background-attachment: fixed;
      }
      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        pointer-events: none;
        background:
          linear-gradient(115deg, rgba(255, 255, 255, 0.62), transparent 34%),
          linear-gradient(rgba(21, 25, 23, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(21, 25, 23, 0.035) 1px, transparent 1px);
        background-size: auto, 72px 72px, 72px 72px;
        mask-image: linear-gradient(to bottom, black, transparent 88%);
      }
      body::after {
        position: fixed;
        top: -18rem;
        right: -12rem;
        width: 42rem;
        height: 42rem;
        z-index: -1;
        content: "";
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 999px;
        box-shadow:
          0 0 0 1.5rem rgba(255, 255, 255, 0.12),
          0 0 5rem rgba(180, 35, 50, 0.08);
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      fetch("./app.jsx")
        .then((response) => response.text())
        .then((source) => {
          const compiled = Babel.transform(source, {
            presets: [[Babel.availablePresets.react, { runtime: "classic" }]],
          }).code;
          (0, eval)(compiled);
        })
        .catch((error) => console.error("Unable to load the React app.", error));
    </script>
  </body>
</html>
